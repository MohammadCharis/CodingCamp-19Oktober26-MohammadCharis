<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List Life Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">

    <!-- Greeting -->
    <section class="card greeting">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark mode"></button>
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date"></div>
      <h1 id="greeting" class="greeting-text">Hello</h1>
      <button id="change-name-btn" type="button" class="btn btn-ghost">Change name</button>
      <form id="name-form" class="inline-form name-form" hidden>
        <input id="name-input" type="text" placeholder="Your name" maxlength="30" aria-label="Your name">
        <button type="submit" class="btn btn-primary">Save</button>
        <button id="cancel-name-btn" type="button" class="btn btn-ghost">Cancel</button>
      </form>
    </section>

    <!-- Focus Timer -->
    <div class="column">
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div id="timer" class="timer">25:00</div>
        <div class="btn-row">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="stop-btn" class="btn btn-ghost">Stop</button>
          <button id="reset-btn" class="btn btn-ghost">Reset</button>
        </div>
      </section>


      <!-- Quick Links -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <form id="link-form" class="inline-form">
          <input id="link-name" type="text" placeholder="Link name" maxlength="20" aria-label="Link name">
          <input id="link-url" type="text" placeholder="URL" aria-label="Link URL">
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="link-list" class="link-list"></div>
      </section>
    </div>

    <div class="column">
      <!-- To-Do List -->
      <section class="card tasks-card">
        <h2>Tasks</h2>
        <form id="task-form" class="inline-form">
          <input id="task-input" type="text" placeholder="Add a new task..." maxlength="100" aria-label="New task">
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="task-error" class="error" role="alert"></p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </div>

  </main>
  <script src="js/script.js"></script>
</body>
</html>
